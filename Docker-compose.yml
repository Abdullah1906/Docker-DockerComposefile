version: '3.8'

services:
  express-app:
    image: abdullah1438/express-app:latest
    container_name: express-app-container
    restart: always
    environment:
      - PORT=5000
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - express-app
