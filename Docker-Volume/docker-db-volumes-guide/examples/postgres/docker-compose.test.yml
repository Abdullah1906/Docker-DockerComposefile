# CI / TEST — tmpfs (সব data RAM এ, container বন্ধ হলে শেষ)
# ⚠️ fsync=off ইত্যাদি শুধু test এর জন্য। Production এ কখনো নয়।
# চালাও: docker compose -f docker-compose.test.yml up -d --wait
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m   # RAM এ data, সর্বোচ্চ ৫১২ MB
    mem_limit: 1g                     # tmpfs এর usage এই limit এর মধ্যে গণ্য হয়
    shm_size: 256mb
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c shared_buffers=128MB
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
