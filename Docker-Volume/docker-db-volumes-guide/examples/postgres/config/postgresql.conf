# উদাহরণ postgresql.conf — নিজের hardware ও workload অনুযায়ী বদলাও (PGTune দেখতে পারো)
listen_addresses = '*'            # Docker network এর ভেতরে সব interface এ শোনো
max_connections = 100
shared_buffers = 256MB            # সাধারণত মোট RAM এর ~25%
effective_cache_size = 768MB      # OS cache সহ আনুমানিক cache
work_mem = 8MB
maintenance_work_mem = 128MB
random_page_cost = 1.1            # SSD/NVMe এর জন্য
log_min_duration_statement = 500  # ৫০০ms এর বেশি সময় নেওয়া query log হবে
