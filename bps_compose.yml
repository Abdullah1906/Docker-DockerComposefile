services:

  bps-api:
    image: your-bps-api:latest
    container_name: bps-api
    restart: always

    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: bps-nginx
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - bps-api
